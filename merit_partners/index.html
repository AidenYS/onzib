<script>
(function () {
  // 링크로 들어오면 항상 최상단부터
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function () { window.scrollTo(0, 0); });

  // 상단 타이머: 접속 시점부터 2시간 카운트다운 (0.1초 단위)
  var clockEl = document.getElementById('mtzClock');
  var pad = function (n) { return (n < 10 ? '0' : '') + n; };
  var endTime = Date.now() + 2 * 60 * 60 * 1000;
  var tick = function () {
    var diff = Math.max(0, endTime - Date.now());
    var t = Math.floor(diff / 1000);
    var d = Math.floor((diff % 1000) / 100);
    clockEl.textContent = pad(Math.floor(t / 3600)) + ':' + pad(Math.floor((t % 3600) / 60)) + ':' + pad(t % 60) + '.' + d;
    if (diff <= 0) endTime = Date.now() + 2 * 60 * 60 * 1000;
  };
  tick();
  setInterval(tick, 100);

  // 선착순 카운터 (data-total / data-completed 값으로 표시)
  var cnt = document.getElementById('mtzCount');
  if (cnt) {
    var total = parseInt(cnt.getAttribute('data-total'), 10) || 30;
    var done = parseInt(cnt.getAttribute('data-completed'), 10) || 27;
    var remain = Math.max(0, total - done);
    document.getElementById('mtzCntTotal').textContent = total;
    document.getElementById('mtzCntRemain').textContent = remain;
    var doneEl = document.getElementById('mtzCntDone');
    var played = false;
    var play = function () {
      if (played) return; played = true;
      var cur = Math.max(0, done - 12);
      var t = setInterval(function () {
        cur++;
        doneEl.textContent = cur;
        if (cur >= done) clearInterval(t);
      }, 90);
    };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (e) { if (e.isIntersecting) { play(); obs.disconnect(); } });
      }, { threshold: 0.4 }).observe(cnt);
    } else { play(); }
    var note = document.getElementById('mtzStickyNote');
    if (note && remain > 0) note.textContent = '선착순 모집 · 남은 자리 ' + remain + '명';
  }

  // 실시간 신청현황 피드
  var SURNAMES = ['김', '이', '박', '최', '정', '강', '조', '윤', '장', '임', '한', '오', '서', '신', '권', '황', '안', '송', '전', '홍'];
  var body = document.getElementById('mtzStatusBody');
  var MAX_ROWS = 6;
  var makeRow = function (isNew) {
    var name = SURNAMES[Math.floor(Math.random() * SURNAMES.length)] + '**';
    var phone = '010-****-**' + Math.floor(Math.random() * 90 + 10);
    var tr = document.createElement('tr');
    if (isNew) tr.className = 'st-new';
    tr.innerHTML = '<td>' + name + '</td><td>' + phone + '</td><td class="st-ok">신청완료</td>';
    return tr;
  };
  if (body) {
    for (var i = 0; i < MAX_ROWS; i++) body.appendChild(makeRow(false));
    var feed = function () {
      body.insertBefore(makeRow(true), body.firstChild);
      while (body.children.length > MAX_ROWS) body.removeChild(body.lastChild);
      setTimeout(feed, 3000 + Math.random() * 4000);
    };
    setTimeout(feed, 2500);
  }

  // 신청현황 영역이 보이면 하단 고정 버튼 숨김
  var sticky = document.getElementById('mtzSticky');
  var apply = document.getElementById('mtzApply');
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { sticky.classList.toggle('hidden', e.isIntersecting); });
    }, { threshold: 0.2 }).observe(apply);
  }
})();
</script>
