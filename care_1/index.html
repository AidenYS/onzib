<div class="cgi-sticky" id="cgiSticky">
  <button type="button" id="cgiStickyBtn">간병사 자격증 무료 신청</button>
  <span class="sticky-note" id="cgiStickyNote">나이·경력 무관 · 신청 1분</span>
</div>

<script>
(function () {
  // 링크로 들어오면 항상 최상단부터
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
  if (location.hash) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  window.scrollTo(0, 0);
  window.addEventListener('pageshow', function () { window.scrollTo(0, 0); });

  // 날짜 자동 갱신: 시작 = 오늘-2일, 마감 = 오늘
  var fmt = function (d) { return (d.getMonth() + 1) + '월 ' + d.getDate() + '일'; };
  var today = new Date();
  var start = new Date(today.getTime() - 2 * 86400000);
  var elS = document.getElementById('cgiDateStart');
  var elE = document.getElementById('cgiDateEnd');
  if (elS) elS.textContent = fmt(start);
  if (elE) elE.textContent = fmt(today);

  // 신청 현황 카운터 (data-total / data-completed 값으로 표시)
  var cnt = document.getElementById('cgiCount');
  if (cnt) {
    var total = parseInt(cnt.getAttribute('data-total'), 10) || 100;
    var done = parseInt(cnt.getAttribute('data-completed'), 10) || 97;
    var remain = Math.max(0, total - done);
    document.getElementById('cgiCntTotal').textContent = total;
    document.getElementById('cgiCntRemain').textContent = remain;
    var doneEl = document.getElementById('cgiCntDone');
    var played = false;
    var play = function () {
      if (played) return; played = true;
      var from = Math.max(0, done - 12), cur = from;
      var t = setInterval(function () {
        cur++;
        doneEl.textContent = cur;
        if (cur >= done) clearInterval(t);
      }, 90);
    };
    if ('IntersectionObserver' in window) {
      new IntersectionObserver(function (entries, obs) {
        entries.forEach(function (e) { if (e.isIntersecting) { play(); obs.disconnect(); } });
      }, { threshold: 0.4 }).observe(cnt);
    } else { play(); }
    var note = document.getElementById('cgiStickyNote');
    if (note && remain > 0) note.textContent = '마감 임박 · 남은 자리 ' + remain + '명';
  }

  var sticky = document.getElementById('cgiSticky');
  var apply = document.getElementById('cgiApply');
  var goApply = function (ev) {
    if (ev) ev.preventDefault();
    apply.scrollIntoView({ behavior: 'smooth', block: 'center' });
    apply.classList.remove('flash');
    void apply.offsetWidth;
    apply.classList.add('flash');
  };
  document.getElementById('cgiStickyBtn').addEventListener('click', goApply);
  var topL = document.getElementById('cgiTopImgLink');
  var botL = document.getElementById('cgiBottomImgLink');
  var banL = document.getElementById('cgiBannerLink');
  var arrL = document.getElementById('cgiArrowsLink');
  var upL = document.getElementById('cgiUpLink');
  if (topL) topL.addEventListener('click', goApply);
  if (botL) botL.addEventListener('click', goApply);
  if (banL) banL.addEventListener('click', goApply);
  if (arrL) arrL.addEventListener('click', goApply);
  if (upL) upL.addEventListener('click', goApply);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { sticky.classList.toggle('hidden', e.isIntersecting); });
    }, { threshold: 0.2 }).observe(apply);
  }
})();
</script>
