<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 혜택 비교 요청 | 혜택비교 상담센터</title>
  <meta name="description" content="인터넷, 휴대폰, 렌탈 혜택 비교를 위한 상담 정보를 입력하세요.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
<!-- Microsoft Clarity -->
<script type="text/javascript">
(function(c,l,a,r,i,t,y){
  c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
  t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
  y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
})(window, document, "clarity", "script", "uryq9of2r0");
</script>
</head>
<body class="form-page">
  <main class="form-shell compact">
    <section class="form-panel">
      <header class="form-header">
        <h1>내 지원금 확인</h1>
        <button class="close-button" type="button" id="closeButton" aria-label="창 닫기">닫기</button>
      </header>

      <div class="form-intro">
        <div class="support-notice">
          <p>입력하신 정보 확인 후<br><strong>상담 전용 번호</strong>로 지원금을 안내드립니다.</p>
          <p>지금 신청하면<br><strong>상담 전용 추가 지원금</strong>도 확인하실 수 있어요.</p>
        </div>
        <p>입력 정보는 혜택 확인과 상담 안내 목적으로만 사용됩니다. 상담 후 진행 여부를 결정하실 수 있습니다.</p>
      </div>

      <form class="consult-form standalone" id="consultForm">
        <input type="hidden" name="source" value="landing-form">
        <fieldset class="service-field">
          <legend><span>*</span> 서비스 선택 <em>다중 선택 가능</em></legend>
          <label class="service-choice"><input type="checkbox" name="service" value="인터넷" checked><b>Wi</b><span>인터넷</span></label>
          <label class="service-choice"><input type="checkbox" name="service" value="휴대폰"><b>5G</b><span>휴대폰</span></label>
          <label class="service-choice"><input type="checkbox" name="service" value="렌탈"><b>Re</b><span>가전렌탈</span></label>
        </fieldset>
        <label class="form-row"><span><i>*</i> 이름</span><input type="text" name="name" autocomplete="name" required></label>
        <div class="form-row">
          <span><i>*</i> 휴대폰</span>
          <div class="phone-grid">
            <select name="tel1" required>
              <option value="">선택</option>
              <option value="010">010</option>
              <option value="011">011</option>
              <option value="016">016</option>
              <option value="017">017</option>
              <option value="018">018</option>
              <option value="019">019</option>
            </select>
            <input type="text" name="tel2" inputmode="numeric" maxlength="4" placeholder="4자리" required>
            <input type="text" name="tel3" inputmode="numeric" maxlength="4" placeholder="4자리" required>
          </div>
        </div>
        <label class="form-row"><span>상담내용</span><textarea name="memo" rows="3" placeholder="희망 통신사, 결합 여부 등을 적어주세요."></textarea></label>
        <input type="hidden" name="time" value="상관없음">
        <label class="agree"><span><i>*</i> 개인정보</span><input type="checkbox" name="agree" required> 수집 및 상담 연락 동의</label>
        <button class="button primary submit" type="submit">지원금 바로 안내받기</button>
        <p class="form-message" id="formMessage" role="status" aria-live="polite"></p>
      </form>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
